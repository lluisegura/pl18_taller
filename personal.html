<!doctype html><html lang="ca"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plaça 18 · Personal</title><style>body{margin:0;background:#f3f6f8;color:#12263b;font-family:system-ui,sans-serif}header{background:#102c48;color:#fff;padding:20px 30px;display:flex;justify-content:space-between;align-items:center}a,button{padding:10px 13px;border:0;border-radius:7px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}a{background:#e6eef4;color:#17384f}button{background:#1263a6;color:#fff}main{max-width:1250px;margin:25px auto;padding:0 20px}h1{margin:0;font-size:22px}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.note{color:#637386;font-size:14px}table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid #d8e2e9;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #e1e8ed;text-align:left;font-size:13px}th{background:#eaf1f5;color:#365067}input,select{width:100%;box-sizing:border-box;border:1px solid #cbd9e3;border-radius:5px;padding:7px;font:inherit}.actions button{background:#e8eff4;color:#23445c;padding:7px 9px}.off{opacity:.48}.form{display:none;background:#fff;border:1px solid #d8e2e9;border-radius:12px;padding:16px;margin-bottom:16px;grid-template-columns:repeat(4,1fr);gap:10px}.form.show{display:grid}@media(max-width:700px){table{display:block;overflow-x:auto}.form.show{grid-template-columns:repeat(2,1fr)}header{padding:17px}}</style><body><header><h1>PLAÇA 18 · Personal</h1><a href="index.html">← Tornar al tauler</a></header><main><div class="bar"><div><h2>Fitxa de personal</h2><div class="note">Alta, baixa i preferències de cada treballador.</div></div><button id="new">+ Afegir treballador</button></div><form class="form" id="form"><input id="short" placeholder="Nom curt" required><input id="full" placeholder="Nom i llinatges"><input id="phone" placeholder="Telèfon"><select id="role"><option>Treballador</option><option>Responsable</option><option>Cap de taller</option><option>Gerència</option><option>RRHH</option></select><select id="p1"><option value="">Assignació 1</option><option>Taller</option><option>Pantalles</option><option>Brodat</option><option>DTF</option><option>Magatzem</option><option>Disseny</option></select><select id="p2"><option value="">Assignació 2</option><option>Taller</option><option>Pantalles</option><option>Brodat</option><option>DTF</option><option>Magatzem</option><option>Disseny</option></select><select id="p3"><option value="">Assignació 3</option><option>Taller</option><option>Pantalles</option><option>Brodat</option><option>DTF</option><option>Magatzem</option><option>Disseny</option></select><select id="p4"><option value="">Assignació 4</option><option>Taller</option><option>Pantalles</option><option>Brodat</option><option>DTF</option><option>Magatzem</option><option>Disseny</option></select><button>Desar treballador</button></form><table><thead><tr><th>Nom curt</th><th>Nom i llinatges</th><th>Telèfon</th><th>Rol</th><th>1</th><th>2</th><th>3</th><th>4</th><th>Estat</th><th></th></tr></thead><tbody id="rows"></tbody></table></main><script>const key='pl18-personal';const initialPeople=[{short:'PINGÜI',full:'',phone:'',role:'Treballador',p:['Magatzem','','',''],active:true},{short:'ANDREU',full:'',phone:'',role:'Cap de taller',p:['Taller','Pantalles','',''],active:true},{short:'BARBARA',full:'',phone:'',role:'Responsable',p:['Brodat','','',''],active:true},{short:'CARLOS',full:'',phone:'',role:'Treballador',p:['Taller','DTF','',''],active:true},{short:'CLAUDIA',full:'',phone:'',role:'Treballador',p:['DTF','Taller','',''],active:true},{short:'FANI',full:'',phone:'',role:'Responsable',p:['DTF','Brodat','Taller',''],active:true},{short:'LUPE',full:'',phone:'',role:'Treballador',p:['Taller','DTF','',''],active:true},{short:'JAUMET',full:'',phone:'',role:'Cap de taller',p:['Taller','','',''],active:true},{short:'JOHNNY',full:'',phone:'',role:'Treballador',p:['Magatzem','Taller','',''],active:true},{short:'JOANNA',full:'',phone:'',role:'Treballador',p:['DTF','Taller','Magatzem',''],active:true},{short:'JOAN REÜLL',full:'',phone:'',role:'Treballador',p:['Taller','','',''],active:true},{short:'LLINÀS',full:'',phone:'',role:'Treballador',p:['Taller','Pantalles','',''],active:true},{short:'JOAN PONS',full:'',phone:'',role:'Treballador',p:['Magatzem','','',''],active:true},{short:'LOURDES',full:'',phone:'',role:'Treballador',p:['Taller','','',''],active:true},{short:'MAGDALENA',full:'',phone:'',role:'Responsable',p:['Magatzem','','',''],active:true},{short:'MANEL',full:'',phone:'',role:'Treballador',p:['Pantalles','Taller','',''],active:true},{short:'MARGALIDA',full:'',phone:'',role:'Treballador',p:['Taller','','',''],active:true},{short:'MARIA',full:'',phone:'',role:'Treballador',p:['Brodat','DTF','Taller',''],active:true},{short:'MOHA',full:'',phone:'',role:'Treballador',p:['Magatzem','','',''],active:true},{short:'RAFEL',full:'',phone:'',role:'Treballador',p:['Magatzem','','',''],active:true},{short:'REBECA',full:'',phone:'',role:'Treballador',p:['Pantalles','Taller','Disseny',''],active:true},{short:'ROSI',full:'',phone:'',role:'Treballador',p:['DTF','Magatzem','Taller',''],active:true}];let people=JSON.parse(localStorage.getItem(key)||'null')||initialPeople;const rows=document.querySelector('#rows'),form=document.querySelector('#form');function esc(x){return String(x||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function draw(){rows.innerHTML=people.map((p,i)=>'<tr class="'+(p.active?'':'off')+'"><td><b>'+esc(p.short)+'</b></td><td>'+esc(p.full)+'</td><td>'+esc(p.phone)+'</td><td>'+esc(p.role)+'</td><td>'+esc(p.p[0])+'</td><td>'+esc(p.p[1])+'</td><td>'+esc(p.p[2])+'</td><td>'+esc(p.p[3])+'</td><td>'+((p.active)?'Actiu':'Baixa')+'</td><td class="actions"><button onclick="toggle('+i+')">'+(p.active?'Baixa':'Reactivar')+'</button></td></tr>').join('')}function save(){localStorage.setItem(key,JSON.stringify(people));draw()}function toggle(i){people[i].active=!people[i].active;save()}document.querySelector('#new').onclick=()=>form.classList.toggle('show');form.onsubmit=e=>{e.preventDefault();people.push({short:short.value.toUpperCase(),full:full.value,phone:phone.value,role:role.value,p:[p1.value,p2.value,p3.value,p4.value],active:true});form.reset();form.classList.remove('show');save()};draw()</script></body></html>
